# DataCrew 基础设施层：postgres(pgvector) + redis
# 说明：MinIO 在当前网络环境下镜像不可达，D1 先用本地磁盘存储适配器占位；
#       网络恢复后取消下方注释即可无缝切换（app/infra/storage.py 是适配器，业务代码零改动）。
# Langfuse 使用云免费额度（见 README 设计决策），不占本地资源。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: datacrew-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datacrew-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- DataCrew API（D3 接入容器）----
  # 容器内 PG/Redis 走 compose 服务名解析（localhost 指向容器自身，连不上）
  app:
    build: .
    container_name: datacrew-app
    command: ["python", "-m", "app.main"]
    environment:
      PG_ADMIN_DSN: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ecommerce
      PG_RO_DSN: postgresql://datacrew_ro:datacrew_ro_pwd@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379/0
      LLM_MODE: ${LLM_MODE:-mock}
      API_KEYS: ${API_KEYS:-dev-key-001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- MinIO（网络恢复后取消注释）----
  # minio:
  #   image: minio/minio:latest
  #   container_name: datacrew-minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - miniodata:/data

volumes:
  pgdata:
  redisdata:
