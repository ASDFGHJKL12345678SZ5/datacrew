[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacrew"
version = "0.1.0"
description = "电商智能问数多智能体系统：LangGraph 多 Agent 编排 + MCP 工具安全层 + 评测闭环"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "openai>=1.40",          # DeepSeek/Qwen 均 OpenAI 兼容
    "mcp[cli]>=1.2",         # MCP 工具层 SDK
    "langchain-mcp-adapters>=0.1",  # LangGraph agent 通过它调用 MCP 工具
    "sqlglot>=25.0",         # SQL AST 解析（安全闸核心）
    "minio>=7.2",
    "httpx>=0.27",
    "tenacity>=8.2",         # 重试
    "streamlit>=1.35",       # demo 前端
    "locust>=2.30",          # 压测
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 数据脚本：长 SQL 字符串与中文常量折行反而损害可读性，豁免行宽
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
